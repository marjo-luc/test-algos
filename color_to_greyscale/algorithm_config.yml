# Input params for the OGC application package generator.
# Every field below lands somewhere specific in the generated CWL --
# see references/algorithm-config.md for the full mapping.
#
# Regenerate after editing:
#   ~/.claude/skills/ogc-app-pack/scripts/generate_cwl.py \
#       --config-file color_to_greyscale/algorithm_config.yml \
#       --cwl-workflow-dir color_to_greyscale/cwl_workflows
# Never hand-edit the generated CWL -- the next push overwrites it.

# --- Identity (OGC req-9: id, label, abstract) ---
algorithm_description: Converts a color image to an 8-bit greyscale image using the ITU-R BT.601 luma weights (L = 0.299R + 0.587G + 0.114B). Reads any format Pillow supports; the output format follows the extension of the output filename.
algorithm_name: to_greyscale
algorithm_version: main
keywords: ogc, image-processing, greyscale, pillow

# --- Provenance ---
code_repository: https://github.com/marjo-luc/test-algos.git
citation: https://github.com/marjo-luc/test-algos.git
author: Marjorie Lucas
contributor: Marjorie Lucas
license: https://raw.githubusercontent.com/marjo-luc/test-algos/refs/heads/main/LICENSE
release_notes: None

# --- Execution ---
run_command: color_to_greyscale.py
ram_min: 2048      # mebibytes -- Pillow decodes the whole image into memory, ~4-8 B/px peak
cores_min: 1
outdir_max: 1024   # mebibytes -- the greyscale result is 1 B/px

# --- Inputs: each becomes `--<name> <value>` on the command line ---
inputs:
  - name: input_image
    doc: Color image to convert. Any format Pillow can read (PNG, JPEG, TIFF, ...). A single-band image is passed through unchanged.
    label: Input image
    type: File
  - name: output_file
    doc: Name of the greyscale image, written inside the output directory. The extension selects the output format. Does not change where results are collected from.
    label: Output filename
    type: string?
    default: greyscale.png

# --- Output: exactly one, always a Directory globbed from ./output* ---
outputs:
  - name: out
    type: Directory
