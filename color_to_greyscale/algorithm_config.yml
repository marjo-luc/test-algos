# Input params for the OGC application package generator.
# Every field below lands somewhere specific in the generated CWL --
# see references/algorithm-config.md for the full mapping.
#
# Regenerate after editing:
#   ~/.claude/skills/ogc-app-pack/scripts/generate_cwl.py \
#       --config-file color_to_greyscale/algorithm_config.yml \
#       --cwl-workflow-dir color_to_greyscale/cwl_workflows
# Never hand-edit the generated CWL -- the next push overwrites it.

# --- Identity (OGC req-9: id, label, abstract) ---
algorithm_description: Converts a color image to a single-band greyscale GeoTIFF using GDAL, applying the ITU-R BT.601 luma weights to the first three bands.
algorithm_name: color-to-greyscale
algorithm_version: main
keywords: ogc, gdal, raster, greyscale, image-processing

# --- Provenance ---
code_repository: https://github.com/marjo-luc/test-algos.git
citation: https://github.com/marjo-luc/test-algos.git
author: Marjorie Lucas
contributor: Marjorie Lucas
license: https://raw.githubusercontent.com/marjo-luc/test-algos/refs/heads/main/LICENSE
release_notes: None

# --- Execution ---
run_command: run.py
ram_min: 2048       # mebibytes -- GDAL reads whole bands as float32 (~16 B/px peak for RGB)
cores_min: 1
outdir_max: 1024    # mebibytes -- output GeoTIFF is 1 B/px, plus the executed notebook

# --- Inputs: each becomes `--<name> <value>` on the command line ---
inputs:
  - name: input_image
    doc: Color image to convert. Any GDAL-readable raster; the first three bands are read as R, G, B. A single-band input is passed through unchanged.
    label: Input image
    type: File
  - name: output_file
    doc: Name of the output GeoTIFF, written inside the output directory. Does not change where results are collected from.
    label: Output filename
    type: string?
    default: greyscale.tif

# --- Output: exactly one, always a Directory globbed from ./output* ---
outputs:
  - name: out
    type: Directory
